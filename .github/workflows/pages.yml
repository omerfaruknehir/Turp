name: Deploy Turp site

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/pages.yml
  pull_request:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate website JavaScript
        run: |
          node --check docs/assets/js/theme-boot.js
          node --check docs/assets/js/site.js
          node --check docs/assets/js/motion.js
          node --check docs/assets/js/logo-motion.js
          node --check docs/assets/js/popup-motion.js
          node --check docs/assets/js/releases.js
          node --check docs/assets/js/releases-v2.js
          node --check docs/assets/js/banner-theme.js
          node --check docs/assets/js/i18n.js
      - name: Validate bilingual release notes
        shell: bash
        run: |
          set -euo pipefail
          for version in 0.24.{12..21}; do
            test -s "docs/releases/RELEASE_NOTES_${version}.md"
            test -s "docs/releases/tr/RELEASE_NOTES_${version}.md"
            notes="$(bash ci/resolve-release-notes.sh "$version")"
            test -s "$notes"
            grep -q '<!-- turp-release-notes:en -->' "$notes"
            grep -q '^## English$' "$notes"
            grep -q '<!-- turp-release-notes:tr -->' "$notes"
            grep -q '^## Türkçe$' "$notes"
          done
      - name: Validate source sitemap
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          expected = {
              'https://omerfaruknehir.github.io/Turp/',
              'https://omerfaruknehir.github.io/Turp/releases/',
              'https://omerfaruknehir.github.io/Turp/privacy/',
              'https://omerfaruknehir.github.io/Turp/terms/',
              'https://omerfaruknehir.github.io/Turp/data-deletion/',
              'https://omerfaruknehir.github.io/Turp/tr/',
              'https://omerfaruknehir.github.io/Turp/tr/releases/',
              'https://omerfaruknehir.github.io/Turp/tr/privacy/',
              'https://omerfaruknehir.github.io/Turp/tr/terms/',
              'https://omerfaruknehir.github.io/Turp/tr/data-deletion/',
          }
          root = ET.parse('docs/sitemap.xml').getroot()
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          assert root.tag == f'{ns}urlset', root.tag
          locations = [node.text for node in root.findall(f'{ns}url/{ns}loc')]
          assert len(locations) == len(set(locations)), 'duplicate sitemap URLs'
          assert set(locations) == expected, (set(locations) ^ expected)
          for location in locations:
              parsed = urlparse(location)
              assert parsed.scheme == 'https', location
              assert parsed.netloc == 'omerfaruknehir.github.io', location
              assert parsed.path.startswith('/Turp/'), location
          PY
      - name: Validate optimized legacy banner asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/assets/images/turp-banner-background-2-1.webp')
          data = path.read_bytes()
          assert 0 < len(data) < 100_000, len(data)
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'not a WebP file'
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Verify built static assets
        run: |
          cmp docs/sitemap.xml _site/sitemap.xml
          cmp docs/assets/images/turp-banner-background-2-1.webp _site/assets/images/turp-banner-background-2-1.webp
          cmp docs/.well-known/microsoft-identity-association.json _site/.well-known/microsoft-identity-association.json
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('_site/sitemap.xml')
          PY
      - name: Validate multilingual Turp Pages output
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = {
              '_site/index.html': ('en', '/Turp/', '/Turp/tr/'),
              '_site/releases/index.html': ('en', '/Turp/releases/', '/Turp/tr/releases/'),
              '_site/privacy/index.html': ('en', '/Turp/privacy/', '/Turp/tr/privacy/'),
              '_site/terms/index.html': ('en', '/Turp/terms/', '/Turp/tr/terms/'),
              '_site/data-deletion/index.html': ('en', '/Turp/data-deletion/', '/Turp/tr/data-deletion/'),
              '_site/tr/index.html': ('tr', '/Turp/', '/Turp/tr/'),
              '_site/tr/releases/index.html': ('tr', '/Turp/releases/', '/Turp/tr/releases/'),
              '_site/tr/privacy/index.html': ('tr', '/Turp/privacy/', '/Turp/tr/privacy/'),
              '_site/tr/terms/index.html': ('tr', '/Turp/terms/', '/Turp/tr/terms/'),
              '_site/tr/data-deletion/index.html': ('tr', '/Turp/data-deletion/', '/Turp/tr/data-deletion/'),
          }
          for filename, (lang, en_path, tr_path) in pages.items():
              path = Path(filename)
              assert path.is_file(), filename
              html = path.read_text(encoding='utf-8')
              assert f'<html lang="{lang}"' in html, filename
              assert f'hreflang="en" href="https://omerfaruknehir.github.io{en_path}"' in html, filename
              assert f'hreflang="tr" href="https://omerfaruknehir.github.io{tr_path}"' in html, filename
              assert 'hreflang="x-default"' in html, filename
              assert 'material-symbols-rounded' in html and '>language</span>' in html, filename

          english = Path('_site/index.html').read_text(encoding='utf-8')
          turkish = Path('_site/tr/index.html').read_text(encoding='utf-8')
          english_releases = Path('_site/releases/index.html').read_text(encoding='utf-8')
          turkish_releases = Path('_site/tr/releases/index.html').read_text(encoding='utf-8')
          release_js = Path('_site/assets/js/releases-v2.js').read_text(encoding='utf-8')
          banner_css = Path('_site/assets/css/banner.css').read_text(encoding='utf-8')
          logo = Path('_site/assets/images/turp-logo.svg').read_text(encoding='utf-8')

          for html in (english, turkish):
              assert 'home-hero__backdrop--turp' in html
              assert 'data-turp-logo' in html
              assert '/Turp/assets/images/turp-banner-background-2-1.webp' not in html
          assert '<strong>Turp</strong>' in english
          assert '<strong>Turp</strong>' in turkish
          assert 'releases-v2.js?v=3' in english_releases
          assert 'releases-v2.js?v=3' in turkish_releases
          assert 'turp-release-notes:en' in release_js
          assert 'turp-release-notes:tr' in release_js
          assert 'localizedReleaseMarkdown' in release_js
          assert '.home-hero__backdrop--turp' in banner_css
          assert '#ef2e52' in banner_css
          assert '#72b442' in banner_css
          assert '#338331' in banner_css
          assert 'M45.355735,12.06325' in logo
          assert 'M54,24.484818' in logo
          assert 'M734' not in logo
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Verify live Microsoft publisher association
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          url="${base%/}/.well-known/microsoft-identity-association.json"

          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error --location --output /tmp/microsoft-identity-association.json --dump-header /tmp/microsoft-identity-association.headers --write-out '%{http_code}' "$url" || true)"
            if [[ "$code" == "200" ]] && python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/microsoft-identity-association.json').read_text(encoding='utf-8'))
          assert data == {
              'associatedApplications': [
                  {'applicationId': '8a39da15-8397-489a-adcc-c6766bcfb085'}
              ]
          }, data
          PY
            then
              content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/\r$/, ""); print $2}' /tmp/microsoft-identity-association.headers | tail -n1)"
              case "$content_type" in
                application/json*|"") exit 0 ;;
              esac
            fi
            sleep $((attempt * 3))
          done

          echo "Live Microsoft publisher association verification failed for $url" >&2
          cat /tmp/microsoft-identity-association.headers >&2 || true
          cat /tmp/microsoft-identity-association.json >&2 || true
          exit 1

      - name: Verify live sitemap
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          url="${base%/}/sitemap.xml"

          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error --location --output /tmp/sitemap.xml --dump-header /tmp/sitemap.headers --write-out '%{http_code}' "$url" || true)"
            if [[ "$code" == "200" ]] && python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/sitemap.xml').getroot()
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          urls = root.findall(f'{ns}url')
          assert len(urls) == 10, len(urls)
          PY
            then
              content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/\r$/, ""); print $2}' /tmp/sitemap.headers | tail -n1)"
              case "$content_type" in
                application/xml*|text/xml*) exit 0 ;;
              esac
            fi
            sleep $((attempt * 3))
          done

          echo "Live sitemap verification failed for $url" >&2
          cat /tmp/sitemap.headers >&2 || true
          exit 1
